name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify
        run: ./gradlew build

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: poe-companion
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
            build/reports/cyclonedx/bom.json
          if-no-files-found: error
          retention-days: 7
