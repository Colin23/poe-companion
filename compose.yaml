services:
  poe-companion-db:
    image: postgres:18.6
    container_name: poe-companion-db
    restart: unless-stopped
    ports:
      - ${POE_COMPANION_DB_PORT}:${POE_COMPANION_DB_PORT}
    networks:
      - poe-companion-network
    environment:
      - POSTGRES_USER=${POE_COMPANION_DB_USER}
      - POSTGRES_PASSWORD=${POE_COMPANION_DB_PASSWORD}
      - POSTGRES_DB=${POE_COMPANION_DB_NAME}
    volumes:
      - poe-companion-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POE_COMPANION_DB_USER} -d ${POE_COMPANION_DB_NAME}'" ]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  poe-companion-network:
    name: poe-companion-network

volumes:
  poe-companion-db-data:
