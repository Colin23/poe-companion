services:
  poe-companion-db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    ports:
      - "${POE_COMPANION_DB_PORT}:5432"
    environment:
      POSTGRES_USER: "${POE_COMPANION_DB_USER}"
      POSTGRES_PASSWORD: "${POE_COMPANION_DB_PASSWORD:?POE_COMPANION_DB_PASSWORD must be set}"
      POSTGRES_DB: "${POE_COMPANION_DB_NAME}"
    volumes:
      - poe-companion-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"${POE_COMPANION_DB_USER}\" -d \"${POE_COMPANION_DB_NAME}\"" ]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  poe-companion-db-data:
