<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="siteHeader(activeSection, username)">
    <div class="brand-and-navigation">
        <a class="site-name" th:href="@{/}">PoE Companion</a>
        <nav class="app-navigation" aria-label="Primary">
            <a th:href="@{/}" th:classappend="${activeSection == 'home'} ? ' is-active' : ''"
               th:attr="aria-current=${activeSection == 'home'} ? 'page' : null">Home</a>
            <a th:href="@{/builds}" th:classappend="${activeSection == 'builds'} ? ' is-active' : ''"
               th:attr="aria-current=${activeSection == 'builds'} ? 'page' : null">Builds</a>
            <a th:href="@{/uniques}" th:classappend="${activeSection == 'uniques'} ? ' is-active' : ''"
               th:attr="aria-current=${activeSection == 'uniques'} ? 'page' : null">Uniques</a>
            <a th:href="@{/acquisitions}" th:classappend="${activeSection == 'acquisitions'} ? ' is-active' : ''"
               th:attr="aria-current=${activeSection == 'acquisitions'} ? 'page' : null">Acquisition</a>
            <a th:href="@{/environment}" th:classappend="${activeSection == 'environment'} ? ' is-active' : ''"
               th:attr="aria-current=${activeSection == 'environment'} ? 'page' : null"
               th:text="${environmentLabel != null ? environmentLabel : 'Select game environment'}">
                Select game environment
            </a>
        </nav>
    </div>
    <div class="session-actions">
        <p class="session-details">Signed in as <strong th:text="${username}">user</strong></p>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Log out</button>
        </form>
    </div>
</header>
</body>
</html>
